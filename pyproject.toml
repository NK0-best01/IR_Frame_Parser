[project]
name = "irframe-parser"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pyside6>=6.11.2",
]

[project.scripts]
irframe-parser = "irframe_parser.main:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
irframe_parser = ["qml/*.qml", "fonts/*.ttf"]

[tool.pytest.ini_options]
pythonpath = ["."]

